# =============================================================================
# cluster.conf — Zentrale Konfiguration fuer alle Skripte
# llama.cpp RPC-Cluster · Ubuntu 22.04.5 LTS · Turing-GPUs (CC 7.5)
# Wird von allen Skripten ueber lib.sh eingelesen. Auf ALLEN Nodes identisch halten!
# =============================================================================

# Admin-User, unter dem gebaut wird und die Dienste laufen
CLUSTER_USER="aiadmin"

# Cluster-Netz (separates Segment, siehe Doku 5.2)
CLUSTER_SUBNET="10.10.10.0/24"
CLUSTER_PREFIX="24"

# Nodes: "hostname:cluster-ip:rolle"   (rolle = control | worker)
# Reihenfolge der Worker = Reihenfolge von --rpc  =>  RPC0, RPC1, RPC2, ...
# ANPASSEN: Hostnamen und IP der Control Plane pruefen!
CLUSTER_NODES=(
    "node-00:10.10.10.5:control"
    "node-01:10.10.10.6:worker"
    "node-02:10.10.10.7:worker"
    "node-03:10.10.10.8:worker"
)

# Treiber / Toolchain (siehe Doku 5.1 und 5.6)
NVIDIA_DRIVER_PKG="nvidia-driver-580"
NVIDIA_DRIVER_MAJOR="580"
CUDA_EXPECTED_VERSION="11.5"
CUDA_ARCH="75"
HOST_CC="/usr/bin/gcc-10"
HOST_CXX="/usr/bin/g++-10"

# llama.cpp (siehe Doku 5.3) — fester Commit fuer reproduzierbare Builds
LLAMA_REPO="https://github.com/ggml-org/llama.cpp.git"
LLAMA_COMMIT="daef7b6874397a5a7c3d7e38b55e2ee0adf7da38"
LLAMA_SRC_DIR="/home/${CLUSTER_USER}/src/llama.cpp-rpc-sync"
LLAMA_BUILD_DIR="/home/${CLUSTER_USER}/build-llama-rpc-sync"
LLAMA_BIN_DIR="${LLAMA_BUILD_DIR}/bin"
LLAMA_COMMIT_FILE="/home/${CLUSTER_USER}/llama-rpc-sync.commit"
# Parallele Build-Jobs (leer = nproc). Bei wenig RAM reduzieren, nvcc braucht ~1-2 GB pro Job.
BUILD_JOBS=""

# RPC-Server auf den Workern (siehe Doku 5.4)
RPC_PORT="50052"
RPC_DEVICE="CUDA0"
# 1 = lokaler Tensor-Cache auf den Workern (ggml-rpc-server -c), beschleunigt Neustarts stark
RPC_CACHE="1"

# Modell und Inferenz-Parameter (siehe Doku 5.5)
MODEL_HF="unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL"
INFER_CTX="4096"
INFER_BATCH="512"
INFER_UBATCH="512"
INFER_KV_TYPE="q8_0"

# llama-server (OpenAI-kompatible API) auf der Control Plane
SERVER_PORT="8080"
# Bind-Adresse (leer = Cluster-IP der Control Plane; 0.0.0.0 = alle Interfaces, dann SERVER_ALLOW_FROM anpassen)
SERVER_HOST=""
SERVER_PARALLEL="1"
# Von wo die API erreichbar sein darf (UFW-Regel)
SERVER_ALLOW_FROM="10.10.10.0/24"
SERVER_API_KEY_FILE="/etc/llama-cluster/api-keys"
